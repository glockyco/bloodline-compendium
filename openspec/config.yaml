schema: spec-driven
context: |
  Game files are proprietary and never enter the repository. Each contributor supplies a copy of the game on their own machine, so CI cannot read game files.
  Data derived from game files, such as records and icons, is stored only in private storage. The published site is the only public form of it, and CI in this public repository never reads it.
  Contributors may work on macOS, Windows or Linux.
  Publishing data extracted from the game on the site is permitted.
  The site describes only the current game build. Game files of earlier builds are not kept.
  The game is in Early Access with large updates every two to three months. Prefer designs that keep each update mostly automated.

