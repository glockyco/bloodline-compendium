schema: spec-driven
context: |
  Game files are proprietary and exist only on the maintainer's macOS machine, so CI cannot read them.
  Publishing data extracted from the game is permitted.
  The site describes only the current game build. Game files of earlier builds are not kept.
  The game is in Early Access with large updates every two to three months.
  One maintainer works with coding agents. Prefer designs that a single person can maintain across updates.

# Project context (optional)
